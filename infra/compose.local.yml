name: xtn-local
services:
  mongo:
    image: mongo:7.0
    ulimits:
      nofile: {soft: 64000, hard: 64000}
    command: [mongod, --replSet, xtn-local, --bind_ip_all]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mongo-data:
