name: ${COMPOSE_PROJECT_NAME:-xtn-prod}
x-api-env: &api-env
  NODE_ENV: production
  PORT: 5000
  MONGO_URI: mongodb://xtn_app:${MONGO_APP_PASSWORD:?}@mongo:27017/xtn_production?authSource=xtn_production&replicaSet=xtn-production
  JWT_SECRET: ${JWT_SECRET:?}
  CORS_ORIGINS: ${CORS_ORIGINS:?}
  TRUST_PROXY_HOPS: 1
  NODE_OPTIONS: --max-old-space-size=768
x-api-image: &api-image
  image: xtn-api:${RELEASE_TAG:-local}
  build:
    context: ..
    dockerfile: backend/Dockerfile
    args: {RELEASE_TAG: "${RELEASE_TAG:-local}"}
services:
  mongo:
    image: mongo:7.0
    ulimits:
      nofile: {soft: 64000, hard: 64000}
    entrypoint: [bash, /opt/xtn/mongo-start.sh]
    environment:
      MONGO_INITDB_ROOT_USERNAME: xtn_root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo-root-password
    secrets: [mongo-root-password, mongo-app-password, mongo-keyfile]
    volumes:
      - mongo-data:/data/db
      - ./production:/opt/xtn:ro
    restart: "${CONTAINER_RESTART:-unless-stopped}"
    mem_limit: 1536m
    healthcheck:
      test: [CMD, mongosh, --quiet, --file, /opt/xtn/mongo-health.js]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  mongo-init:
    image: mongo:7.0
    entrypoint: []
    user: "0:0"
    command: [mongosh, "mongodb://mongo:27017/admin?directConnection=true", --quiet, --file, /opt/xtn/mongo-init.js]
    environment: {MONGO_INITDB_ROOT_USERNAME: xtn_root}
    secrets: [mongo-root-password, mongo-app-password]
    volumes: ["./production:/opt/xtn:ro"]
    depends_on: {mongo: {condition: service_healthy}}
  migrate:
    <<: *api-image
    environment:
      <<: *api-env
      MIGRATION_DATABASE: xtn_production
    command: [node, /app/scripts/migrate-indexes.cjs, --production, --apply]
    depends_on: {mongo-init: {condition: service_completed_successfully}}
  bootstrap:
    <<: *api-image
    profiles: [tools]
    user: "${DEPLOY_UID:-1000}:${DEPLOY_GID:-1000}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *api-env
      BOOTSTRAP_ADMIN: "true"
      BOOTSTRAP_ALLOW_EXISTING: "true"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_FILE: /run/secrets/admin-password
    secrets: [admin-password]
    command: [node, scripts/bootstrap-admin.js]
    depends_on: {migrate: {condition: service_completed_successfully}}
  api:
    <<: *api-image
    environment: *api-env
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: "${CONTAINER_RESTART:-unless-stopped}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  web:
    image: xtn-web:${RELEASE_TAG:-local}
    build: {context: .., dockerfile: frontend/Dockerfile, args: {RELEASE_TAG: "${RELEASE_TAG:-local}"}}
    environment: {SITE_ADDRESS: "${SITE_ADDRESS:?}"}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes: ["caddy-data:/data", "caddy-config:/config"]
    depends_on: {api: {condition: service_healthy}}
    restart: "${CONTAINER_RESTART:-unless-stopped}"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
secrets:
  mongo-root-password: {file: "${DEPLOY_DIR:?}/secrets/mongo-root-password"}
  mongo-app-password: {file: "${DEPLOY_DIR:?}/secrets/mongo-app-password"}
  mongo-keyfile: {file: "${DEPLOY_DIR:?}/secrets/mongo-keyfile"}
  admin-password: {file: "${DEPLOY_DIR:?}/secrets/admin-password"}
volumes: {mongo-data: {}, caddy-data: {}, caddy-config: {}}
